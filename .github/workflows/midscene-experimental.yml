name: Midscene experimental

on:
  push:
    branches: [ci/midscene-e2e]
    paths:
      - ".github/workflows/midscene-experimental.yml"
      - "tests/midscene/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midscene-experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omarchy-vm:
    name: Install real Omarchy in a headless VM
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Omarchy VM
        run: tests/midscene/install-omarchy-vm.sh

      - name: Upload installer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omarchy-vm-installer-evidence
          path: .midscene-omarchy/omarchy-iso/test-runs/**/runs/**
          if-no-files-found: warn
          retention-days: 3

