name: Midscene experimental

on: workflow_dispatch

permissions:
  contents: read
  packages: read

concurrency:
  group: midscene-experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omarchy-vm:
    name: Run Midscene in a real Omarchy VM
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
      MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
      MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
      MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
      MIDSCENE_MODEL_REASONING_ENABLED: ${{ secrets.MIDSCENE_MODEL_REASONING_ENABLED }}
      MIDSCENE_COMPUTER_HEADLESS_LINUX: "true"
      MIDSCENE_REPLANNING_CYCLE_LIMIT: "40"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Midscene model configuration
        run: |
          test -n "$MIDSCENE_MODEL_API_KEY"
          test -n "$MIDSCENE_MODEL_NAME"
          test -n "$MIDSCENE_MODEL_BASE_URL"
          test -n "$MIDSCENE_MODEL_FAMILY"

      - name: Check Midscene model before the expensive VM install
        run: |
          payload=$(jq -nc --arg model "$MIDSCENE_MODEL_NAME" '{
            model: $model,
            messages: [{role: "user", content: "Reply OK."}],
            max_tokens: 1
          }')
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 90 \
            --retry 4 --retry-all-errors --retry-delay 5 \
            -H "Authorization: Bearer $MIDSCENE_MODEL_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "${MIDSCENE_MODEL_BASE_URL%/}/chat/completions" \
            >/dev/null

      - name: Install ORAS client
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Sign in to GitHub Container Registry
        run: echo "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ github.token }}

      - name: Restore prebuilt Omarchy VM
        run: tests/midscene/restore-omarchy-vm.sh

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/midscene/package-lock.json

      - name: Install Midscene and VNC bridge
        run: |
          sudo apt-get install -y --no-install-recommends \
            fluxbox tigervnc-viewer x11-xserver-utils xvfb
          npm --prefix tests/midscene ci --include=optional --ignore-scripts

      - name: Run real Omarchy Midscene E2E
        run: tests/midscene/run-omarchy-midscene.sh

      - name: Upload installer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omarchy-vm-installer-evidence
          path: .midscene-omarchy/omarchy-iso/test-runs/**/runs/**
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Omarchy Midscene report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omarchy-midscene-e2e-report
          path: tests/midscene/midscene_run/
          if-no-files-found: warn
          retention-days: 7
